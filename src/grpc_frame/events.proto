syntax = "proto3";

package frame;

message SubscribeRequest {
  string topic = 1;
  bool once = 2;
  string source = 3;
}

message Event {
  string topic = 1;
  bytes payload = 2;
  int64 ts_ns = 3;
  string source = 4;
}

service Events {
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}