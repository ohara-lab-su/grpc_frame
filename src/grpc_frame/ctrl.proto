syntax = "proto3";

package ctrl;

message Empty {}

message MethodInfo {
  string name = 1;
  string signature = 2;
}

message MethodTable {
  repeated MethodInfo methods = 1;
}

message DispatchRequest {
  string method = 1;
  bytes args = 2;
  bytes kwargs = 3;
}

message DispatchResponse {
  bool ok = 1;
  bytes result = 2;
  string error = 3;
}

service Control {
  rpc Describe(Empty) returns (MethodTable);
  rpc Call(DispatchRequest) returns (DispatchResponse);
  rpc StreamCall(DispatchRequest) returns (stream DispatchResponse);
}