syntax = "proto3";

package ctrl;

message DispatchRequest {
  string method = 1;  // 呼び出したい ctrl メソッド名
  bytes args = 2;     // JSON bytes: list
  bytes kwargs = 3;   // JSON bytes: dict
}

message DispatchResponse {
  bool ok = 1;
  bytes result = 2;   // JSON bytes: any
  string error = 3;   // ok=false のときのエラー文字列
}

service Control {
  rpc Call(DispatchRequest) returns (DispatchResponse);
}