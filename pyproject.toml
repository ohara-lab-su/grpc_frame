[build-system]
requires = [
    "setuptools>=61.0,<68; python_version < '3.8'",
    "setuptools>=61.0; python_version >= '3.8'",
    "grpcio-tools==1.54.3; python_version < '3.8'",
    "grpcio-tools; python_version >= '3.8'",
]
build-backend = "setuptools.build_meta"

[project]
name = "grpc-frame"

version = "0.5.20"

description = "gRPC communication framework for remote access to Python device classes through server and client APIs."
authors = [
  { name="Kengo NAKADA", email="kengo.nakada@email.com" }
]
readme = "README.md"
requires-python = ">=3.7"
#requires-python = ">=3.8"
#requires-python = ">=3.11"
dependencies = [
    #"x_logger",
    "xlogger-py",
    #
    "coloredlogs",
    "colorlog",
    #
    "sphinx",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "linkify-it-py",
    #
    # python >= 3.8
    # "protobuf>=4.21,<5", # for python3.7
    # "protobuf==4.21.12; python_version < '3.8'", # for python3.7
    # "protobuf; python_version >= '3.8'",
    # "protobuf==4.21.12; python_version < '3.8'",
    "protobuf; python_version >= '3.8'",
    # "grpcio==1.54.3; python_version < '3.8'",  # for pyhon3.7
    # "grpcio; python_version >= '3.8'",
    # "grpcio==1.54.3; python_version < '3.8'",
    "grpcio; python_version >= '3.8'",
    # "grpcio-tools==1.54.3; python_version < '3.8'",  # for python3.7
    #
    # "grpcio-tools; python_version >= '3.8'",
    # grpcio-tools is only needed when building from source.
    "google",
]

[project.urls]
Homepage = "https://ohara-lab-su.github.io/grpc_frame/"
Documentation = "https://ohara-lab-su.github.io/grpc_frame/"
Repository = "https://github.com/ohara-lab-su/grpc_frame"
Issues = "https://github.com/ohara-lab-su/grpc_frame/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 89

[tool.isort]
profile = "black"

[tool.setuptools.package-data]
grpc_frame = ["*.proto"]
