[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grpc_frame"

version = "0.5.10"

description = "gRPC server/client frame"
authors = [
  { name="Kengo NAKADA", email="kengo.nakada@email.com" }
]
readme = "README.md"
requires-python = ">=3.7"
#requires-python = ">=3.8"
#requires-python = ">=3.11"
dependencies = [
"x_logger",
#
"coloredlogs",
"colorlog",
#
"sphinx",
"myst-parser",
"sphinx-autobuild",
"sphinx-rtd-theme",
"sphinxcontrib-napoleon",
"linkify-it-py",
#
#"grpcio",
#"grpcio-tools",
#"protobuf",
#
#"protobuf>=4.21,<5", # for python3.7
# python < 3.8
"protobuf==4.21.12; python_version < '3.8'", # for python3.7
"grpcio==1.54.3; python_version < '3.8'",  # for pyhon3.7
"grpcio-tools==1.54.3; python_version < '3.8'",  # for python3.7
#
# python >= 3.8
"protobuf; python_version >= '3.8'",
"grpcio; python_version >= '3.8'",
"grpcio-tools; python_version >= '3.8'",
#
"google",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

# ここでpytestのiniと同じようにオプションが書ける
# 例えばテストマーク、フィルタ、カバレッジなども追記可能

[tool.black]
line-length = 89

[tool.isort]
profile = "black"